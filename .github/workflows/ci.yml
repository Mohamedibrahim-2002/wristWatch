name: SWEBOK v4 DevSecOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-audit:
    name: Verification, Security Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Vulnerability Audit (SWEBOK v4 Ch. 08 & 13)
        run: npm run audit:security

      - name: Generate CycloneDX SBOM
        run: npm run sbom:generate

      - name: Run Automated Test Suites (SWEBOK v4 Ch. 05 & 12)
        run: npm test

      - name: Build Application (Frontend & Server)
        run: npm run build
